<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chroma Channel</title>
  </head>
  <body>
    <div id="app">
      <header id="overhang" class="overhang">
        <img class="overhang-logo" src="/overhang-logo.webp" alt="" aria-hidden="true" />
        <div class="overhang-title">Chroma Channel</div>
        <div id="overhang-clock" class="overhang__clock" aria-hidden="true"></div>
      </header>
      <nav id="left-nav" class="left-nav" aria-label="Main navigation"></nav>
      <main id="screen-container" class="screen-container">
        <div id="screen-loading" class="screen screen-active">
          <p class="loading-message">Loading...</p>
        </div>
        <div id="screen-grid" class="screen">
          <div id="content-grid" class="content-grid"></div>
        </div>
        <div id="screen-video" class="screen">
          <video id="video-player" class="video-player" controls autoplay></video>
        </div>
        <div id="screen-search" class="screen">
          <div class="search-header">
            <input id="search-input" class="search-input" type="text" placeholder="Search..." />
          </div>
          <div id="search-results" class="content-grid"></div>
        </div>
        <div id="screen-settings" class="screen">
          <h2 class="screen-title">Settings</h2>
          <div id="settings-list" class="settings-list"></div>
        </div>
        <div id="screen-error" class="screen">
          <div class="error-container">
            <h2 class="error-title">Connection Error</h2>
            <p class="error-message">
              Unable to load content. Please check your network connection.
            </p>
            <div class="error-actions"></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="src/App.ts"></script>
  </body>
</html>

name: Local package rehearsal (no publication)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zip unzip binutils xmlsec1
      - run: xmlsec1 --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run package:local
      - name: Assert reproducible package contents
        run: node scripts/check-reproducible-packages.mjs
      - name: Generate SHA-256 checksums
        run: sha256sum platforms/webos/build/*.ipk platforms/tizen/build/*.wgt platforms/vizio/build/*.zip > checksums.txt
